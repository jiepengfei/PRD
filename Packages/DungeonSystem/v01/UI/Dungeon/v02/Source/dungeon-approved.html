<script>
(()=>{const assets=JSON.parse(document.getElementById('dungeon-reference-assets').textContent);const nodes=[['fight','战斗','寨门守卫'],['fight','战斗','营中伏兵'],['chest','宝箱','遗落木箱'],['supply','补给','村民补给'],['story','剧情','营前旧信'],['boss','首领','山贼首领']];let state={current:2,entered:[false,false]};const saved=window.openai?.widgetState?.privateContent;if(saved&&Number.isInteger(saved.current)&&saved.current>=0&&saved.current<=6)state={current:saved.current,entered:Array.isArray(saved.entered)?saved.entered:[false,false]};const roots=[document.getElementById('dungeon-textured'),document.getElementById('dungeon-flat')].filter(Boolean);function render(){roots.forEach((root,set)=>{root.innerHTML=`<header><h2>山贼营寨</h2><small>已完成 ${state.current} / 6</small></header><p>循山径而入，直抵首领营帐。</p><nav class="route" aria-label="地下城遭遇节点">${nodes.map(([type,label,name],i)=>`${i?`<span class="link ${i<=state.current?'passed':''}" aria-hidden="true"></span>`:''}<button type="button" class="node cursor-interaction ${i<state.current?'done':i===state.current?'current':'future'}" ${i===state.current?'aria-current="step"':'disabled'} data-node="${i}" aria-label="${name}，${i<state.current?'已完成':i===state.current?'点击进入':'尚未到达'}"><img class="icon" data-kind="${type}" src="${assets[set][type]}" alt="">${i<state.current?'<span class="mask" aria-hidden="true"></span>':''}<span class="label">${label}</span></button>`).join('')}</nav><div class="status" aria-live="polite">${state.entered[set]&&state.current<6?'已进入 · '+nodes[state.current][2]:''}</div>`;root.onclick=e=>{const btn=e.target.closest('[data-node]');if(!btn||+btn.dataset.node!==state.current||state.entered[set])return;state.entered[set]=true;root.querySelector('.status').textContent='已进入 · '+nodes[state.current][2];window.openai?.setWidgetState?.({modelContent:{preview:'两套原图标比较',iconSet:set===0?'水墨质感':'简约平涂',currentNode:nodes[state.current][1]},privateContent:state})?.catch(()=>{});};});}render();window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s&&Number.isInteger(s.current)&&s.current>=0&&s.current<=6){state={current:s.current,entered:Array.isArray(s.entered)?s.entered:[false,false]};render();}});if(globalThis.Tweak){roots.forEach(root=>{const preview={completed:state.current};const t=new Tweak({container:root,onChange:()=>{state.current=preview.completed;state.entered=[false,false];render();}});t.addSlider(preview,'completed',{label:'已完成节点数',min:0,max:6,step:1});});}
})();
</script>
