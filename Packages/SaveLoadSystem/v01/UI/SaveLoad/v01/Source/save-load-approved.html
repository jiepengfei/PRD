      function render() {
        root.querySelectorAll('[data-mode]').forEach(button => button.setAttribute('aria-pressed',String(button.dataset.mode===mode)));
        list.innerHTML = [3,0,1,2].map(index => { const slot=slots[index]; return `${index===0?'<div class="slot-separator"></div>':''}<button type="button" class="slot ${slot?'':'slot-empty'}" data-slot="${index}" aria-pressed="${selected===index}"><canvas class="slot-brush" aria-hidden="true"></canvas><span class="slot-row"><span class="slot-name">${slot?safe(slot.name):'空白存档'}</span><span class="slot-kind">${['一','二','三','自'][index]}</span></span><span class="slot-note">${slot?(index===3?'自动保存':'第 '+slot.day+' 日')+' · '+safe(slot.place.split(' · ')[1]):'尚未留下旅程记录'}</span></button>`; }).join('');
        const slot = slots[selected];
        if (slot) {
          detail.innerHTML = `<div class="detail-label">${safe(slot.kind)} · 第 ${slot.day} 日</div><h3 class="detail-heading">${safe(slot.name)}</h3><div class="detail-place">${safe(slot.place)}</div><div class="detail-rule"></div><div class="detail-stats"><div><span class="stat-label">气血</span><span class="stat-number">${slot.hp} / 100</span></div><div><span class="stat-label">行动点</span><span class="stat-number">${slot.ap} / 5</span></div></div><p class="detail-description">${safe(slot.note)}</p><div class="detail-time">保存于 ${safe(slot.time)}</div>`;
        } else {
          detail.innerHTML = '<div class="detail-label">手动存档 · 03</div><h3 class="detail-heading">尚未落笔</h3><div class="detail-rule"></div><p class="detail-description">在这里留下一份旅程，日后可从此继续。</p>';
        }
        if (mode==='save' && selected!==3) detail.insertAdjacentHTML('beforeend',`<label class="name-field">存档名称<input class="name-input" maxlength="18" aria-label="存档名称" value="${safe(slot?slot.name:'新的旅程')}" /></label>`);
        main.disabled = (mode==='load'&&!slot)||(mode==='save'&&selected===3);
        main.textContent = mode==='load'?'读取此存档':selected===3?'自动保存管理':slot?'覆盖此存档':'保存到此处';
        if(mode==='save'&&selected===3) notice.textContent='自动档由游戏保存，不能手动覆盖。';
        root.querySelectorAll('button').forEach(button=>button.classList.add('cursor-interaction'));
        requestAnimationFrame(drawBrushes);
      }
      function drawBrushes() {
        const paper = root.querySelector('.save-window');
        const probe = document.createElement('span');
        probe.hidden = true;
        paper.appendChild(probe);
        const resolveColor = value => {probe.style.color=value;return getComputedStyle(probe).color;};
        const dense = resolveColor('var(--jade)');
        const pale = resolveColor('color-mix(in srgb,var(--mountain) 18%,var(--paper))');
        root.querySelectorAll('.slot-brush').forEach((canvas,index)=>{
          const box=canvas.parentElement.getBoundingClientRect();
          const width=box.width,height=box.height;
          if(!width||!height)return;
          const scale=Math.min(window.devicePixelRatio||1,2);
          canvas.width=Math.round(width*scale);canvas.height=Math.round(height*scale);
          const ctx=canvas.getContext('2d');
          if(!ctx)return;
          ctx.scale(scale,scale);
          let seed=113+index*71;
          const random=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
          const color=canvas.parentElement.getAttribute('aria-pressed')==='true'?dense:pale;
          ctx.fillStyle=color;ctx.strokeStyle=color;
          const leftEdge=y=>{const v=Math.max(0,Math.min(1,(y/height-.07)/.86));return width*(.073-.061*v)+Math.sin(v*7.5+.5)*2.1+Math.sin(v*19)*.7;};
          const rightEdge=y=>{const v=Math.max(0,Math.min(1,(y/height-.07)/.86));return width*(.984-.057*v)+Math.sin(v*5.4+1)*2.5+Math.sin(v*15)*.7;};
          const phase=index*.47;
          const topEdge=t=>height*(.092+Math.sin(t*8.1+phase)*.022+Math.sin(t*17+.6)*.009-t*.019);
          const bottomEdge=t=>height*(.907+Math.sin(t*6.9+.8+phase)*.026+Math.sin(t*14.3)*.008+t*.009);
          ctx.beginPath();
          ctx.moveTo(leftEdge(topEdge(0)),topEdge(0));
          for(let i=0;i<=110;i++){const t=i/110;ctx.lineTo(leftEdge(topEdge(t))+t*(rightEdge(topEdge(t))-leftEdge(topEdge(t))),topEdge(t)+(random()-.5)*1.4);}
          for(let i=0;i<=40;i++){const y=topEdge(1)+i/40*(bottomEdge(1)-topEdge(1));ctx.lineTo(rightEdge(y)+(random()-.5)*2.3,y);}
          for(let i=110;i>=0;i--){const t=i/110;ctx.lineTo(leftEdge(bottomEdge(t))+t*(rightEdge(bottomEdge(t))-leftEdge(bottomEdge(t))),bottomEdge(t)+(random()-.5)*1.6);}
          for(let i=40;i>=0;i--){const y=topEdge(0)+i/40*(bottomEdge(0)-topEdge(0));ctx.lineTo(leftEdge(y)+(random()-.5)*2,y);}
          ctx.closePath();ctx.fill();
          // Uneven ink absorption adds material without changing the established color palette.
          ctx.save();ctx.clip();ctx.globalCompositeOperation='destination-out';
          for(let i=0;i<12;i++){
            const x=width*(.1+random()*.78),y=height*random(),radius=height*(.12+random()*.25);
            const bloom=ctx.createRadialGradient(x,y,0,x,y,radius);
            bloom.addColorStop(0,'rgba(0,0,0,0.055)');bloom.addColorStop(1,'rgba(0,0,0,0)');
            ctx.fillStyle=bloom;ctx.fillRect(x-radius,y-radius,radius*2,radius*2);
          }
          ctx.restore();ctx.fillStyle=color;
          // Left-lower and right-upper dry-brush bands have maximum lengths in a 4:6 ratio.
          const leftDryLength=width*.08;
          const rightDryLength=width*.12;
          ctx.globalCompositeOperation='destination-out';
          for(let i=0;i<75;i++){
            const y=height*(.075+random()*.405);
            const edge=rightEdge(y);
            const start=edge-rightDryLength*(.12+random()*.88);
            ctx.globalAlpha=.35+random()*.65;ctx.lineWidth=.35+random()*1.15;
            const rise=height*(.075+random()*.055);
            ctx.beginPath();ctx.moveTo(start,y+rise*.45);ctx.bezierCurveTo(start+rightDryLength*.3,y+rise*.1,edge-2,y-rise*.3,edge+4,y-rise*.55);ctx.stroke();
          }
          for(let i=0;i<55;i++){
            const y=height*(.08+random()*.39),x=rightEdge(y)-rightDryLength*random();
            ctx.globalAlpha=.35+random()*.65;ctx.fillRect(x,y,.4+random()*5,.3+random()*1.1);
          }
          for(let i=0;i<48;i++){
            const y=height*(.53+random()*.395);
            const edge=leftEdge(y);
            ctx.globalAlpha=.4+random()*.6;ctx.lineWidth=.4+random()*1.2;
            const rise=height*(.06+random()*.05);
            ctx.beginPath();ctx.moveTo(edge-3,y+rise*.4);ctx.lineTo(edge+leftDryLength*(.12+random()*.88),y-rise*.6);ctx.stroke();
          }
          for(let i=0;i<25;i++){
            const y=height*(.54+random()*.38);
            ctx.globalAlpha=.5+random()*.5;
            ctx.fillRect(leftEdge(y)+leftDryLength*random(),y,.5+random()*2.1,.4+random()*.9);
          }
          ctx.globalCompositeOperation='source-over';ctx.globalAlpha=.65;
          for(let i=0;i<24;i++){
            const y=height*(.10+random()*.36),edge=rightEdge(y);
            ctx.lineWidth=.3+random()*.65;ctx.beginPath();ctx.moveTo(edge-rightDryLength*.4,y+height*.025);ctx.lineTo(Math.min(width,edge+random()*5),y-height*.04);ctx.stroke();
          }
          ctx.globalAlpha=.5;
          for(let i=0;i<10;i++){
            const y=height*(.10+random()*.36),x=Math.min(width-2,rightEdge(y)+random()*4);
            ctx.fillRect(x,y,.6+random()*2,.4+random()*.8);
          }
        });
        probe.remove();
      }
      function persist() {
        if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{preview:'武侠存读UI',mode,selectedSlot:selected+1},privateContent:{mode,selected}}).catch(()=>{});
      }
      function closeModal() {modal.hidden=true;pending=null;main.focus();}
      list.addEventListener('click',event=>{const button=event.target.closest('[data-slot]');if(!button)return;selected=Number(button.dataset.slot);notice.textContent='';render();persist();});
      root.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{mode=button.dataset.mode;notice.textContent='';render();persist();}));
      main.addEventListener('click',()=>{
        if(main.disabled)return;
        const input=root.querySelector('.name-input');
        pending={mode,index:selected,name:input?.value.trim()||'新的旅程'};
        root.querySelector('.confirm-title').textContent=mode==='load'?'从此继续旅程？':slots[selected]?'覆盖这份存档？':'保存当前旅程？';
        root.querySelector('.confirm-text').textContent=mode==='load'?`将读取「${slots[selected].name}」。当前未保存的进度将被替换。`:`将当前进度保存为「${pending.name}」${slots[selected]?'，替换此槽原有记录。':'。'}`;
        confirmButton.textContent=mode==='load'?'确认读取':'确认保存';modal.hidden=false;confirmButton.focus();
      });
      root.querySelector('[data-cancel]').addEventListener('click',closeModal);
      confirmButton.addEventListener('click',()=>{
        if(!pending)return;
        const action=pending;
        if(action.mode==='save')slots[action.index]={name:action.name,day:1,place:'新手村 · 练剑场',hp:100,ap:5,time:'2026.11.03  14:36',note:'村民带来了山贼的消息，准备前往村外。',kind:'手动存档'};
        closeModal();render();notice.textContent=action.mode==='load'?`已模拟读取「${slots[action.index].name}」，未操作真实存档。`:`已模拟保存「${action.name}」，未操作真实存档。`;persist();
      });
      root.querySelector('.save-close').addEventListener('click',()=>{if(!modal.hidden)closeModal();notice.textContent='已模拟返回游戏；预览仍保留在这里。';});
      root.addEventListener('keydown',event=>{if(event.key==='Escape'&&!modal.hidden){event.stopPropagation();closeModal();}});
      const restored=window.openai?.widgetState?.privateContent;
      if(restored){if(restored.mode==='save'||restored.mode==='load')mode=restored.mode;if(Number.isInteger(restored.selected)&&restored.selected>=0&&restored.selected<slots.length)selected=restored.selected;}
      window.addEventListener('openai:set_globals',event=>{const state=event.detail?.globals?.widgetState?.privateContent;if(!state)return;if(state.mode==='save'||state.mode==='load')mode=state.mode;if(Number.isInteger(state.selected)&&state.selected>=0&&state.selected<slots.length)selected=state.selected;render();});
      render();
      if(globalThis.ResizeObserver)new ResizeObserver(()=>requestAnimationFrame(drawBrushes)).observe(list);
      if(window.matchMedia){const appearance=window.matchMedia('(prefers-color-scheme: dark)');if(appearance.addEventListener)appearance.addEventListener('change',drawBrushes);}
      if(globalThis.Tweak){const design={spacing:30,serif:true};const tweak=new Tweak({container:root.querySelector('.save-window'),onChange:()=>{root.querySelector('.save-body').style.gap=design.spacing+'px';root.querySelectorAll('.save-title,.detail-heading').forEach(node=>node.style.fontFamily=design.serif?'"Songti SC","SimSun",serif':'"Microsoft YaHei",sans-serif');}});tweak.addSlider(design,'spacing',{label:'左右留白',min:16,max:44,unit:'px'});tweak.addToggle(design,'serif',{label:'宋体标题'});}
    })();
  </script>
</div>
